<style>
  /* ═══ POP-UP CSS (ROZET YUKARIDA) ═══ */
  .announcement-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 35, 102, 0.45);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease, visibility 0.3s ease;
    padding: 16px;
    box-sizing: border-box;
  }

  .announcement-modal-overlay.active {
    opacity: 1;
    visibility: visible;
  }

  .announcement-modal-card {
    position: relative;
    background: #ffffff;
    border-radius: 20px;
    max-width: 400px;
    width: 100%;
    max-height: 90vh;

    box-shadow: 0 20px 45px rgba(0, 35, 102, 0.22);
    border: 1.5px solid rgba(0, 155, 119, 0.25);
    transform: translateY(20px) scale(0.96);
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    display: flex;
    flex-direction: column;
  }

  .announcement-modal-overlay.active .announcement-modal-card {
    transform: translateY(0) scale(1);
  }

  .announcement-close-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: rgba(0, 0, 0, 0.6);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 10;
    transition: background 0.2s, transform 0.2s;
  }

  .announcement-close-btn:hover {
    background: #009B77;
    transform: rotate(90deg);
  }

  /* Görsel alanı */
  .announcement-media {
    position: relative;
    width: 100%;
    background: #fdf6ec;
    text-align: center;
    padding: 12px 12px 0 12px;
    box-sizing: border-box;
  }

  .announcement-media img {
    width: 100%;
    height: auto;
    max-height: 280px;
    object-fit: contain;
    border-radius: 12px;
    display: block;
    margin: 0 auto;
  }

  /* Sol üst köşeye sabitlenen rozet */
  .announcement-badge {
    position: absolute;
    top: 18px;
    left: 18px;
    background: rgba(0, 155, 119, 0.95);
    color: #ffffff;
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.05em;
    padding: 5px 11px;
    border-radius: 16px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.18);
    display: flex;
    align-items: center;
    gap: 5px;
    z-index: 5;
  }

  .announcement-content {
    padding: 16px 20px 20px 20px;
    text-align: left;
  }

  .announcement-title {
    font-family: 'Amiri', serif;
    font-size: 21px;
    font-weight: 700;
    color: #002366;
    margin: 0 0 10px 0;
    line-height: 1.3;
  }

  .announcement-meta {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 16px;
    padding: 10px 12px;
    background: #faf8f5;
    border-radius: 10px;
    border: 1px solid rgba(0, 155, 119, 0.12);
  }

  .meta-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    font-family: 'Noto Serif TR', serif;
    font-size: 12.5px;
    color: #3a4742;

  }

  .meta-row i {
    color: #009B77;
    font-size: 14px;
    margin-top: 2px;
    flex-shrink: 0;

    grid-template-columns: 1fr 1fr;

  .ann-btn {

    align-items: center;

    gap: 6px;

    border-radius: 10px;

    border-color: #009B77;

    color: #ffffff;

  .ann-btn-wp:hover {
    background: #1eb956;
    border-color: #1eb956;
    transform: translateY(-2px);
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const popup = document.getElementById("announcementPopup");
    const closeBtn = document.getElementById("closeAnnouncement");

    setTimeout(() => {
      if (!sessionStorage.getItem("announcementClosed_21Ekim")) {
        popup.classList.add("active");
      }
    }, 700);

    function closePopup() {
      popup.classList.remove("active");
      sessionStorage.setItem("announcementClosed_21Ekim", "true");
    }

    if (closeBtn) closeBtn.addEventListener("click", closePopup);

    popup.addEventListener("click", (e) => {
      if (e.target === popup) closePopup();
    });
  });
</script>
