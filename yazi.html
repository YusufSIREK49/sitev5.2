 <link rel="stylesheet" href="style.css?v=1.1">

<body>

  <!-- Navbar Şablonu -->

  <div class="nav-inner">
    <a href="index.html" class="nav-logo-wrap">
      <img src="https://cdn1.site-media.eu/images/114/22934790/GeerkenLogo-Photoroom-82aMDiSMSNM52OeysD1XRQ-EgWrwxwoIVNv8WhyNw0qWA.png" alt="BTÜ Geçerken">

        <span class="nav-univ">Bursa Teknik Üniversitesi</span>
        <span class="nav-comm">Geçerken Topluluğu</span>
      </div>

    <nav id="main-nav">
      <a href="index.html" class="nav-link">Ana Sayfa</a>

    </nav>

    <button id="mobile-menu-btn" aria-label="Menüyü aç/kapat">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

  <main class="container article-container">
    <div id="articleDetail">
      <!-- JavaScript içeriği buraya dinamik dolduracak -->
    </div>
  </main>

  <script src="blog.js"></script>
  <script>
    // URL'den id parametresini al (Örn: yazi.html?id=31)
    const urlParams = new URLSearchParams(window.location.search);
    const postId = parseInt(urlParams.get('id'));

    // Eşleşen blog yazısını bul
    const post = blogPosts.find(p => p.id === postId);

    const articleContainer = document.getElementById('articleDetail');

    if (post) {
      document.title = `${post.title} | BTU Geçerken`;
      articleContainer.innerHTML = `
        <div class="article-header">
          <span class="post-cat">${post.cat}</span>
          <h1>${post.title}</h1>
          <div class="post-meta">${post.date}</div>
        </div>
        <div class="article-hero-img" style="background-image: url('${post.img}'); height: 350px; background-size: cover; margin: 20px 0;"></div>
        <div class="article-body">
          ${post.content}
        </div>
      `;
    } else {
      articleContainer.innerHTML = `<h2>Yazı bulunamadı!</h2><a href="btugecerkenblog.html">Bloglara Dön</a>`;
    }
  </script>

</body>
</html>
